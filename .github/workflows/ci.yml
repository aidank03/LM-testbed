name: Test and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: liner-stability doctor
      - run: factor doctor
      - run: factor run --request configs/motion_request.json --out outputs/ci-factor
      - run: liner-stability run --config configs/demo.json --out outputs/ci-demo --n 2
      - run: python -m pip wheel . --no-deps --wheel-dir dist
